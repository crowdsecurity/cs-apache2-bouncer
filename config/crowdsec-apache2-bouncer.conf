## Basic configuration
CrowdsecURL http://127.0.0.1:8080
CrowdsecAPIKey $API_KEY

# Behavior if we can't reach (or timeout) LAPI, and in stream mode before the
# first set of decisions has been loaded.
# block | allow | fail
CrowdsecFallback allow

# Target location for blocked requests. If not set, the default is to return HTTP 429
#CrowdsecLocation /denied
CrowdsecBlockedHTTPCode 403

## How decisions are obtained
# live   = one API query per client, cached for CrowdsecCacheTimeout
# stream = decisions are polled in the background and kept locally, so no
#          request ever waits on the API. Requires CrowdsecCache.
CrowdsecMode live

# Only used by stream mode: how often to poll for changes.
#CrowdsecUpdateFrequency 10s

## Cache configuration

# Shared cache for decisions.
#
# In stream mode this must be large enough to hold every decision you receive,
# or decisions are evicted and those clients stop being blocked. Measured:
# allow about 128 bytes per decision, so 100000 decisions want 16MB. The error
# log reports eviction after each poll, so watch it after enabling stream mode
# or subscribing to a large blocklist.
#
#   CrowdsecCache shmcb:crowdsec(16777216)
CrowdsecCache shmcb

# How long one client's verdict is reused before asking again.
CrowdsecCacheTimeout 60

## Timeouts
#CrowdsecConnectTimeout 1s
#CrowdsecTimeout 5s

Crowdsec On

## AppSec (WAF) and bot detection
#
# Unset means AppSec is not used at all. Point this at the appsec datasource's
# listen_addr, or at its listen_socket as unix:/path/to.sock.
#CrowdsecAppsecURL http://127.0.0.1:7422
#
# Must match the datasource's path setting. A 404 from AppSec nearly always
# means these disagree.
#CrowdsecAppsecPath /
#
# AppSec sits on the request path, so its budget is much tighter than the
# local API's.
#CrowdsecAppsecConnectTimeout 200ms
#CrowdsecAppsecTimeout 1s
#
# What happens when AppSec cannot be reached: passthrough (default) or deny.
# This is an availability choice, not a security one - an attacker who can
# degrade AppSec buys a window with no inspection.
#CrowdsecAppsecFailureAction passthrough
#
# How much request body is forwarded for inspection. Buffered per request in
# flight, so the worst case is this times MaxRequestWorkers. 0 forwards none,
# which leaves the WAF blind to anything carried in a body.
#CrowdsecAppsecBodyLimit 1m
#
# What to do with a body over that limit. drop (default) blocks the request.
# bypass lets it through UNINSPECTED, which is a WAF bypass anyone can trigger
# by padding a request body.
#CrowdsecAppsecBodyLimitAction drop
#
# Enable per scope. The bot-detection challenge serves its own assets under
# /crowdsec-internal/challenge/, and those are always sent to AppSec and never
# to the origin, even outside a scope where this is on - a challenged visitor
# cannot complete without them.
#<Location />
#    CrowdsecAppsec On
#</Location>
